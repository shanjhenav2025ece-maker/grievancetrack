<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>View Grievances - GrievanceTrack</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
        }

        .header {
            background-color: #1f4e79;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        h2 {
            text-align: center;
            color: #1f4e79;
        }

        .grievance {
            background: white;
            margin: 20px 0;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .grievance h3 {
            color: #1f4e79;
        }

        .status {
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1f4e79;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>GrievanceTrack</h1>
    <p>View Citizen Grievances</p>
</div>

<div class="container">

    <h2>Registered Grievances</h2>

    <div id="grievanceList">
        Loading grievances...
    </div>

    <a href="/" class="back">← Back to Home</a>

</div>

<script>
    fetch('/api/grievances')
        .then(response => response.json())
        .then(data => {

            const list = document.getElementById("grievanceList");

            if (data.length === 0) {
                list.innerHTML = "<p>No grievances found.</p>";
                return;
            }

            list.innerHTML = "";

            data.forEach(grievance => {

                const card = document.createElement("div");
                card.className = "grievance";

                card.innerHTML = `
    <h3>Grievance #${grievance.grievanceId}</h3>

    <p>
        <strong>Description:</strong>
        ${grievance.description || "Not available"}
    </p>

    <p>
        <strong>Location:</strong>
        ${grievance.location || "Not available"}
    </p>

    <p class="status">
        <strong>Status:</strong>
        ${grievance.status || "Pending"}
    </p>

    <p>
        <strong>Category:</strong>
        ${grievance.category?.name || "Not available"}
    </p>

    <p>
        <strong>Department:</strong>
        ${grievance.department?.name || "Not available"}
    </p>

    <p>
        <strong>Created At:</strong>
        ${grievance.createdAt || "Not available"}
    </p>
`;
                list.appendChild(card);
            });
        })
        .catch(error => {
            document.getElementById("grievanceList").innerHTML =
                "<p>Unable to load grievances.</p>";
        });
</script>

</body>
</html>
