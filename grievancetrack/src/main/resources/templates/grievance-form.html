<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Grievance - GrievanceTrack</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f7fb;
    }

    .header {
      background-color: #1f4e79;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .form-container {
      width: 90%;
      max-width: 600px;
      margin: 35px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #1f4e79;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    textarea {
      height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 12px;
      border: none;
      border-radius: 5px;
      background-color: #1f4e79;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #1f4e79;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="header">
  <h1>GrievanceTrack</h1>
</div>

<div class="form-container">

  <h2>Submit Grievance</h2>

  <form>
    <label>Citizen Name</label>
    <input type="text" placeholder="Enter your name">

    <label>Email</label>
    <input type="email" placeholder="Enter your email">

    <label>Phone</label>
    <input type="text" placeholder="Enter your phone number">

    <label>Category</label>
    <select>
      <option>Select Category</option>
      <option>Road Maintenance</option>
      <option>Street Light</option>
      <option>Water Supply</option>
      <option>Garbage Collection</option>
    </select>

    <label>Location</label>
    <input type="text" placeholder="Enter complaint location">

    <label>Complaint Description</label>
    <textarea placeholder="Describe your grievance"></textarea>

    <button type="button">Submit Grievance</button>
  </form>

  <a href="/" class="back">← Back to Home</a>

</div>

</body>
</html>
